services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vcos
      POSTGRES_PASSWORD: vcos
      POSTGRES_DB: vcos
    ports:
      - "5432:5432"
    volumes:
      - vcos_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  vcos_pg:
